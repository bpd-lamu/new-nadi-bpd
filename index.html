<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#022c22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NADI BPD LAMU" />
  <title>NADI BPD LAMU • Sistem Informasi & Kinerja BPD Desa Lamu</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="apple-touch-icon" href="./logo.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #022c22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #065f46 0%, #022c22 70%);
      color: #ffffff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.4s ease;
    }
    #splash-logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(251, 191, 36, 0.25);
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-top: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #install-banner {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 460px;
      margin: 0 auto;
      z-index: 60;
      background: linear-gradient(135deg, #064e3b, #022c22);
      border: 1.5px solid #fbbf24;
      color: #fff;
      border-radius: 18px;
      padding: 12px 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.45);
      font-size: 12px;
    }
    #install-btn {
      background: #fbbf24;
      color: #022c22;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <img id="splash-logo" src="./logo.png" alt="Logo NADI BPD LAMU" />
    <h2 style="margin-top:14px;font-size:18px;letter-spacing:0.5px;">NADI BPD DESA LAMU</h2>
    <p style="font-size:12px;color:#a7f3d0;margin-top:4px;">Kec. Tilamuta • Kab. Boalemo • Prov. Gorontalo</p>
    <div class="spinner"></div>
  </div>

  <!-- Meneruskan parameter ?page=tamu atau ?page=aspirasi dari scan QR ke Google Apps Script -->
  <iframe
    id="app-frame"
    allow="camera *; microphone *; geolocation *; clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>

  <div id="install-banner">
    <div>
      <strong style="color:#fde68a;display:block;">Pasang Aplikasi NADI BPD LAMU</strong>
      <span style="font-size:11px;color:#d1fae5;">Akses cepat presensi & kinerja langsung dari layar utama HP.</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button id="install-btn">Install</button>
      <button onclick="document.getElementById('install-banner').style.display='none'" style="background:transparent;border:none;color:#a7f3d0;font-weight:bold;padding:6px;cursor:pointer;">✕</button>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT (/exec) ANDA
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz_dx6iLY0Ld2Dd686zy4dOA4TS8OWBzChfuXGqPsQL5ywleZMNk-Rm9La30qAtcw70/exec";

    (function initAppFrame() {
      const frame = document.getElementById("app-frame");
      const splash = document.getElementById("splash-screen");
      const params = new URLSearchParams(window.location.search);
      const page = params.get("page");

      let targetUrl = GAS_WEB_APP_URL;
      if (page) {
        const sep = targetUrl.indexOf("?") === -1 ? "?" : "&";
        targetUrl += sep + "page=" + encodeURIComponent(page);
      }

      frame.src = targetUrl;
      frame.onload = function() {
        splash.style.opacity = "0";
        setTimeout(function() { splash.style.display = "none"; }, 400);
      };
      setTimeout(function() { splash.style.display = "none"; }, 6000);
    })();

    // Registrasi Service Worker PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {});
      });
    }

    // Prompt Install ke Layar Utama HP
    let deferredPrompt;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById("install-banner");
      banner.style.display = "flex";
      document.getElementById("install-btn").onclick = async function() {
        banner.style.display = "none";
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
        }
      };
    });
  </script>
</body>
</html>
