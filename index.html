<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NADI BPD LAMU — Sistem Informasi Manajemen BPD Desa Lamu</title>
  <link rel="icon" type="image/png" href="https://i.ibb.co/tPZdMF9p/268bc6a3-9609-40f5-b81a-99fa66295d0c.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #022C22;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" allow="camera; geolocation; microphone; clipboard-read; clipboard-write" allowfullscreen></iframe>

  <script>
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbz_dx6iLY0Ld2Dd686zy4dOA4TS8OWBzChfuXGqPsQL5ywleZMNk-Rm9La30qAtcw70/exec";
    const params = new URLSearchParams(window.location.search);
    const page = params.get("page");
    const targetUrl = page ? (GAS_EXEC_URL + "?page=" + encodeURIComponent(page)) : GAS_EXEC_URL;
    document.getElementById("app-frame").src = targetUrl;
  </script>
</body>
</html>
